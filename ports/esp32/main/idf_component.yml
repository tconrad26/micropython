dependencies:
  espressif/mdns: "~1.1.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  # beachdisplay5: USB Host Library, used once at boot to put the BG95-M3
  # modem's USB link into genuine suspend (see boards/BEACHDISPLAY5_S3).
  # Independently versioned/maintained component, not part of core esp-idf
  # since v6.0 -- confirmed compatible with idf 5.5.2 (this project's
  # pinned version) by a standalone build test, 2026-08-02.
  espressif/usb:
    version: "*"
    rules:
      - if: "target == esp32s3"
  idf:
    version: ">=5.3.0"
