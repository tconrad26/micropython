dependencies:
  espressif/mdns: "~1.1.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  # beachdisplay5: USB Host Library, used once at boot to put the BG95-M3
  # modem's USB link into genuine suspend (see boards/BEACHDISPLAY5_S3).
  # Independently versioned/maintained component, not part of core esp-idf
  # since v6.0. Was unpinned ("*") and had resolved to 1.4.1 against idf
  # 5.5.2 (dependencies.lock.esp32s3, confirmed 2026-08-02) -- explicitly
  # pinned to 1.5.0 on 2026-08-20 for its "automatic root-port suspend
  # before light sleep when esp_light_sleep_start() is called" fix
  # (CHANGELOG.md, gated by CONFIG_ESP_SLEEP_EVENT_CALLBACKS), directly
  # relevant to the BD00009/BD00010 eDRX+USB current-spike investigation.
  # NOTE: 1.5.0 requires idf >=5.5.3, one patch above the 5.5.2 that was
  # locked -- the build machine's ESP-IDF checkout must be bumped to
  # >=5.5.3 before `idf.py reconfigure` will re-resolve to this version;
  # otherwise the component manager will refuse it and fall back.
  espressif/usb:
    version: "^1.5.0"
    rules:
      - if: "target == esp32s3"
  idf:
    version: ">=5.3.0"
